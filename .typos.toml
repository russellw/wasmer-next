[files]
extend-exclude = [
  "target",
  "Cargo.lock",
  ".git",
  "node_modules",
  # Exclude non english docs
  "docs/cn",
  "docs/de",
  "docs/es",
  "docs/fr",
  "docs/ja",
  "docs/ko",
  "wasmer-test-files",
  "assets",
  # Exclude specific test data that isn't code
  "*.stdout",
  "*.stderr",
  "*.stdin",
  "*.wasm",
  "*.wast",
  "*.out",
  "*.inc",
  "*.txt",
  "*.md.out",
  "CHANGELOG.md",
  "**/CHANGELOG.md",
  # Imported upstream suites and vendored code
  "tests/wasixv2/upstream",
  "guest/libc",
  "**/third-party",
  # external submodule
  "lib/napi",

]

[default.extend-words]
# Global technical terms and valid abbreviations
FPR = "FPR"
fpr = "fpr"
alow = "alow"
fle = "fle"
OLT = "OLT"
Ot = "Ot"
daa = "daa"
HOM = "HOM"
oOtQIDI7q = "oOtQIDI7q"
_oOtQIDI7q = "_oOtQIDI7q"
lala_oOtQIDI7q = "lala_oOtQIDI7q"
existant = "existant"
fourty = "fourty"
# Scene ID
tne = "tne"
# Linux ABI identifiers (lib/wasix/codegen/wit and the code generated from it)
controllen = "controllen"
exta = "exta"
EXTA = "EXTA"
fre = "fre"
FRE = "FRE"
sme = "sme"
SME = "SME"
usig = "usig"
wronly = "wronly"

# Kernel/ABI abbreviations, compiler flags, and deliberately split test payloads
nd = "nd"
caf = "caf"
thr = "thr"
mak = "mak"
ond = "ond"
hel = "hel"
ba = "ba"
oif = "oif"
exportfs = "exportfs"
iif = "iif"
rto = "rto"
Iinclude = "Iinclude"
fo = "fo"
ACCES = "ACCES"
iput = "iput"
Inh = "Inh"
sems = "sems"
filp = "filp"
unparented = "unparented"
childs = "childs"
parms = "parms"
unx = "unx"
anc = "anc"
helo = "helo"
PN = "PN"
writeable = "writeable"
expireds = "expireds"

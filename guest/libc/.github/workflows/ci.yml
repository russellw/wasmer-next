name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sysroot:
    name: sysroot (upstream LLVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe in build-info.json

      - uses: ./.github/actions/build-sysroot

      # Best effort: a full artifact quota should not fail the build.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: sysroot-wasixv2
          retention-days: 14
          path: |
            build-wasixv2/sysroot-wasixv2.tar.gz
            build-wasixv2/sha256sums.txt
          if-no-files-found: error

  # Builds with a wasix-org/llvm-project release (--target=wasm32-wasixv2).
  # Skipped until the repository variable WASIXV2_LLVM_TAG names a fork
  # release, e.g. 22.1.801.
  sysroot-fork:
    name: sysroot (wasix-org LLVM ${{ vars.WASIXV2_LLVM_TAG }})
    if: vars.WASIXV2_LLVM_TAG != ''
    runs-on: ubuntu-24.04
    env:
      WASIXV2_LLVM_TAG: ${{ vars.WASIXV2_LLVM_TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load toolchain pins
        run: grep -E '^[A-Z0-9_]+=' wasixv2/toolchain.env >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build libxml2

      - name: Fetch wasix-org LLVM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-dl" "$HOME/llvm-fork"
          gh release download "$WASIXV2_LLVM_TAG" -R wasix-org/llvm-project \
            -p LLVM-Linux-x86_64.tar.gz -D "$RUNNER_TEMP/llvm-dl"
          tar -xzf "$RUNNER_TEMP/llvm-dl/LLVM-Linux-x86_64.tar.gz" -C "$HOME/llvm-fork"
          clang=$(find "$HOME/llvm-fork" -path '*/bin/clang' | head -n1)
          echo "LLVM_BIN=$(dirname "$clang")" >> "$GITHUB_ENV"

      - name: Cache llvm-project source (compiler-rt, C++ runtimes)
        uses: actions/cache@v6
        with:
          path: build-wasixv2/src
          key: llvm-src-${{ env.LLVM_COMMIT }}

      - name: Install wasm-tools
        run: |
          v=$WASM_TOOLS_VERSION
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v$v/wasm-tools-$v-x86_64-linux.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-tools-$v-x86_64-linux" >> "$GITHUB_PATH"

      - name: Build sysroot
        run: wasixv2/build-sysroot.sh -o build-wasixv2 --target wasm32-wasixv2 --package

      - name: Smoke test
        run: wasixv2/test/run.sh build-wasixv2/sysroot-wasixv2 build-wasixv2/smoke
      # TODO(wasixv2): run the wasixv2 test suite here (`make wasixv2-test`, the wasixv2/tests
      # submodule) against the sysroot built above. It MUST be enabled: until it is,
      # nothing in CI checks that real programs built with this libc still run, and a regression
      # only shows up when someone runs the suite by hand. The suite is green while every failure
      # is listed in its expected-failures.txt, so the step can be required from the start. It
      # needs a wasmer built from wasmerio/wasmer feat/wasixv2 and a wasixcc with
      # wasm32-wasixv2 support (wasix-org/wasixcc#87, not released yet), and the checkout above
      # needs `submodules: true`. The suite has no CI of its own: libc2 and wasmer are the only
      # places it runs.

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: sysroot-wasixv2-fork-llvm
          retention-days: 14
          path: |
            build-wasixv2/sysroot-wasixv2.tar.gz
            build-wasixv2/sha256sums.txt

name: Release

# Tags are date based: vYYYY-MM-DD.N (see wasixv2/README.md).
on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe in build-info.json

      # Same build and smoke test as CI; no artifact storage involved.
      - uses: ./.github/actions/build-sysroot

      - name: Write release notes
        run: |
          {
            echo "libc2 sysroot for \`wasm32-wasixv2\`. Unpack \`sysroot-wasixv2.tar.gz\` and pass"
            echo "\`--sysroot=<dir>/sysroot-wasixv2\`; compiler-rt builtins are in"
            echo "\`lib/wasm32-wasixv2/libclang_rt.builtins.a\`. See \`wasixv2/README.md\`."
            echo
            echo "The wasixv2 ABI is not stable yet, so releases are prereleases."
            echo
            echo '```json'
            cat build-wasixv2/sysroot-wasixv2/share/wasixv2/build-info.json
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease \
            build-wasixv2/sysroot-wasixv2.tar.gz build-wasixv2/sha256sums.txt

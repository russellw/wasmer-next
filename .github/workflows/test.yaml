  #   - wasixcc with wasm32-wasixv2 support (wasix-org/wasixcc#87, not released yet),
  #   - the wasix-org/llvm-project wasix-22.1.8 toolchain (no release yet),
  #   - a libc2 sysroot (wasix-org/libc2 has no release yet),
  # each pinned and installed before `make test-wasixv2`. The suite has no CI of its own: wasmer
  # and libc2 are the only places it runs.
  product_workspace:
    needs: changes
    if: ${{ needs.changes.outputs.product == 'true' }}
    name: Product workspace and NAPI
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      - uses: ./.github/actions/load_toolchain
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_toolchain }}
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - run: cargo check --workspace --locked
      - name: Check canonical WASIX Rust bindings
        run: cargo test --locked -p wasixv2-exec --test generated
      - run: cargo build --locked -p wasmer-napi --features cli
  ci_success:
    name: Tests CI
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    needs:
      - changes
      - setup
      - lint
      - check_wasixv2_wasm
      - cargo_deny
      - product_workspace
      - test_build_docs_rs
      - build_linux_riscv64
      - build
      - test
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Required jobs passed
        run: echo "All required jobs passed or were skipped"

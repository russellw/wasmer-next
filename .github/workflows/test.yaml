name: test-sys
on:
  push:
    branches:
      - main
      - edge
      - "with-ci-.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      release:
        description: "Make release"
# Only superseded PR runs may cancel an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GH_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1
  NEXTEST_PROFILE: "ci"
  RUSTUP_WINDOWS_PATH_ADD_BIN: 1
  WASI_SDK_VERSION: "22"
  S3_CACHE_VERSION: "3"
  # Job containers do not inherit the runner pod env; keep equal to the aux pod value.
  RUNS_ON_S3_BUCKET_CACHE: gha-cache-ci-aux-eu-west-3-public
  RUNS_ON_AWS_REGION: eu-west-3
  DEV_BACKEND_CIUSER_TOKEN: ${{ secrets.DEV_BACKEND_CIUSER_TOKEN }}
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
      product: ${{ steps.changes.outputs.product }}
      code: ${{ steps.changes.outputs.code }}
      build_targets: ${{ steps.changes.outputs.build_targets }}
      test_stages: ${{ steps.changes.outputs.test_stages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test area selection
        run: python3 .github/test_ci_changes.py
      - name: Select jobs and matrix entries
        id: changes
        run: python3 .github/ci-changes.py
  setup:
    name: Set up
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    outputs:
      VERSION: ${{ steps.setup.outputs.VERSION }}
      DOING_RELEASE: ${{ steps.setup.outputs.DOING_RELEASE }}
    steps:
      - name: Set up env vars
        id: setup
        shell: bash
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          DOING_RELEASE=$(echo $VERSION | grep -c '^[0-9]\+\.[0-9]\+\.[0-9]\+\(-\([a-zA-Z]\+\)\?[0-9]*\)\?$' || true)
          echo "DOING_RELEASE=${DOING_RELEASE}" >> $GITHUB_OUTPUT
          echo $VERSION
          echo $DOING_RELEASE
  dependency_cooldown:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Dependency cooldown
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      - name: Configure private runtime access
        uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Check for eligible dependency updates
        run: cargo +nightly update
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Code lint
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      - name: Configure private runtime access
        uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install libtinfo
        shell: bash
        run: |
          sudo apt-get update -y && sudo apt-get install -y libtinfo6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - name: Install LLVM (Linux)
        # $HOME instead of /opt: not root-writable on hardened ARC runners
        run: |
          mkdir -p $HOME/llvm-23
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" --retry 3 --proto '=https' --tlsv1.2 -sSf https://github.com/wasmerio/llvm-custom-builds/releases/download/23.x/llvm-linux-amd64.tar.zst -L -o - | tar --zstd -xf - --strip-components=1 -C $HOME/llvm-23
          echo "$HOME/llvm-23/bin" >> $GITHUB_PATH
          echo "LLVM_SYS_231_PREFIX=$HOME/llvm-23" >> $GITHUB_ENV
      - name: Install taplo
        run: |
          mkdir -p $HOME/.local/bin
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gzip -d - | install -m 755 /dev/stdin $HOME/.local/bin/taplo
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: &cargo-cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ./target/*
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-make-lint-linux-x64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-make-lint-linux-x64-
      - run: make lint
        env:
          ENABLE_CRANELIFT: "1"
          ENABLE_LLVM: "1"
          ENABLE_SINGLEPASS: "1"
      - name: Assert no files have changed
        run: |
          git status
          ! [[ $(git status -s) ]]
      - name: Verify pinned wasix-libc sysroot is up to date
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/ci-constants.env
          latest=$(gh release list --exclude-pre-releases --order desc -R wasix-org/wasix-libc --json tagName -q '.[0].tagName')
          newest=$(printf '%s\n' "$latest" "$WASIX_LIBC_SYSROOT_TAG" | sort -V | tail -1)
          if [ "$WASIX_LIBC_SYSROOT_TAG" != "$newest" ]; then
            echo "Pinned sysroot ($WASIX_LIBC_SYSROOT_TAG) is older than latest release ($latest)"
            exit 1
          fi
      - name: Verify pinned wasix rust toolchain is up to date
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/ci-constants.env
          latest=$(gh release list --exclude-pre-releases --order desc -R wasix-org/rust --json tagName -q '.[0].tagName')
          newest=$(printf '%s\n' "$latest" "$WASIX_RUST_TOOLCHAIN_TAG" | sort -V | tail -1)
          if [ "$WASIX_RUST_TOOLCHAIN_TAG" != "$newest" ]; then
            echo "Pinned rust toolchain ($WASIX_RUST_TOOLCHAIN_TAG) is older than latest release ($latest)"
            exit 1
          fi
  check_wasixv2_wasm:
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    name: WASIX v2 wasm check (${{ matrix.component }})
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        component: [core, webhost, exec, wasix1, facade]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      - name: Configure private runtime access
        uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
          targets: wasm32-unknown-unknown
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: *cargo-cache-paths
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasixv2-wasm-${{ matrix.component }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check browser libraries (compile only)
        run: make check-wasixv2-wasm-${{ matrix.component }}
  cargo_deny:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: cargo-deny
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      - name: Configure private runtime access
        uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      # Run on the host so Git can use the job-local runtime app token.
      - uses: ./.github/actions/load_toolchain
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_toolchain }}
      - run: cargo install cargo-deny --locked
      - run: cargo deny --locked --log-level error check
  test_build_docs_rs:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Build docs.rs
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      - name: Configure private runtime access
        uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: x86_64-unknown-linux-gnu
      - run: cargo install toml-cli --locked # toml-cli is required to run `make test-build-docs-rs`
      - name: Install `ninja` on Ubuntu
        shell: bash
        run: |
          sudo apt-get update -y && sudo apt-get install -y ninja-build
      - name: Install LLVM 23
        run: |
          LLVM_DIR=$(pwd)/${{ env.LLVM_DIR }}
          mkdir ${LLVM_DIR}
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" --retry 3 --proto '=https' --tlsv1.2 -sSf https://github.com/wasmerio/llvm-custom-builds/releases/download/23.x/llvm-linux-amd64.tar.zst -L -o - | tar --zstd -xf - --strip-components=1 -C ${LLVM_DIR}
          echo "ENABLE_LLVM=1" >> $GITHUB_ENV
          echo "${LLVM_DIR}/bin" >> $GITHUB_PATH
          echo "${LLVM_DIR}/usr/bin" >> $GITHUB_PATH
          echo "LLVM_SYS_231_PREFIX=${LLVM_DIR}" >> $GITHUB_ENV
        env:
          LLVM_DIR: .llvm
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: *cargo-cache-paths
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-test-build-docs-rs-linux-x64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-test-build-docs-rs-linux-x64-
      - name: make test-build-docs-rs-ci
        run: make test-build-docs-rs-ci
  build_linux_riscv64:
    needs: changes
    if: ${{ needs.changes.outputs.product == 'true' }}
    name: ${{ matrix.build-what.name }} - linux-riscv64
    # TODO: re-enable custom runner: runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build-what:
          - key: capi
            build-cmd: "make build-capi && make package-capi"
            name: "C-API"
          - key: wasmer
            build-cmd: "make build-wasmer && make package-wasmer"
            name: "Wasmer-cli binary"
    steps:
      - name: Check cross-dependency app credentials
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Cross-dependency GitHub App secrets are unavailable; cargo cannot fetch wasmerio/wasmer-runtime. Configure CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID and CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY. Fork PRs require a trusted run with these secrets."
            exit 1
          fi
      - name: Mint cross-dependency token
        id: cross-dependency-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_DEPENDENCY_GITHUB_APP_PRIVATE_KEY }}
          owner: wasmerio
          repositories: wasmer-runtime
          permission-contents: read
      - name: Use kernel Git mirror
        shell: bash
        run: git config --global url."https://kernel.googlesource.com/pub/scm/".insteadOf https://git.kernel.org/pub/scm/
      - uses: actions/checkout@v6
        with:
          # libaio on pagure.io uses dumb HTTP and cannot be shallow-cloned.
          fetch-depth: 0
          submodules: recursive
      #- uses: ./.github/actions/load_toolchain
      #  id: load_toolchain
      #- uses: dtolnay/rust-toolchain@stable
      #  with:
      #    toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
      #    target: riscv64gc-unknown-linux-gnu
      - name: Configure private runtime access
        uses: ./.github/actions/setup-runtime
        with:
          token: ${{ steps.cross-dependency-token.outputs.token }}
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: ./target/*
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-make-build-wasmer-${{ matrix.build-what.key }}-linux-riscv64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-make-build-wasmer-${{ matrix.build-what.key }}-linux-riscv64-
      - name: Build cross image
        run: |
          docker build -t wasmer/riscv64 ${GITHUB_WORKSPACE}/.github/cross-linux-riscv64/
        env:
          CROSS_DOCKER_IN_DOCKER: true
      - name: Build ${{ matrix.build-what.key }}
        run: |
          ${{ matrix.build-what.build-cmd }}
        env:
          CARGO_BINARY: docker run -v /var/run/docker.sock:/var/run/docker.sock -v ${HOME}/.gitconfig:/root/.gitconfig:ro -v ${RUNNER_TEMP}/wasmer_runtime_token:${RUNNER_TEMP}/wasmer_runtime_token:ro -e CARGO_NET_GIT_FETCH_WITH_CLI=true -v ${GITHUB_WORKSPACE}:/project -w /project wasmer/riscv64 cargo
          CROSS_DOCKER_IN_DOCKER: true
          CARGO_TARGET: riscv64gc-unknown-linux-gnu
          ENABLE_LLVM: 0
      - name: Dist
        if: ${{ matrix.build-what.key == 'capi' }}
        run: |
          make distribution
        env:
          CARGO_BINARY: docker run -v /var/run/docker.sock:/var/run/docker.sock -v ${HOME}/.gitconfig:/root/.gitconfig:ro -v ${RUNNER_TEMP}/wasmer_runtime_token:${RUNNER_TEMP}/wasmer_runtime_token:ro -e CARGO_NET_GIT_FETCH_WITH_CLI=true -v ${GITHUB_WORKSPACE}:/project -w /project wasmer/riscv64 cargo
          CROSS_DOCKER_IN_DOCKER: true
          CARGO_TARGET: riscv64gc-unknown-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: true
          TARGET: riscv64gc-unknown-linux-gnu
          TARGET_DIR: target/riscv64gc-unknown-linux-gnu/release
      - name: Upload Artifacts
        if: ${{ matrix.build-what.key == 'capi' }}
        uses: actions/upload-artifact@v4
        with:
          name: capi-linux-riscv64
          path: dist
          if-no-files-found: error
          retention-days: 2
  build:
    needs: [setup, changes]
    if: ${{ needs.changes.outputs.product == 'true' }}
    name: ${{ matrix.build-what.name }} - ${{ matrix.metadata.build }}
    # TODO: re-enable custom runner: runs-on: ${{ (matrix.metadata.build == 'linux-x64' || matrix.metadata.build == 'linux-musl' || matrix.metadata.build == 'windows-gnu') && (github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64') || matrix.metadata.build == 'linux-arm64' && (github.event_name == 'pull_request' && 'aux-pub-16cpu-arm64' || 'aux-pub-trusted-16cpu-arm64') || matrix.metadata.os }}
    runs-on: ${{ matrix.metadata.os }}
    strategy:
      fail-fast: false
      matrix:
        skip_macos:
          - ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'macos') }}
        build-what: ${{ fromJSON(needs.changes.outputs.build_targets) }}
        metadata:
          - build: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
            llvm_url: "https://github.com/wasmerio/llvm-custom-builds/releases/download/23.x/llvm-linux-amd64.tar.zst"
            supports_v8: true
          - build: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            exe: ""

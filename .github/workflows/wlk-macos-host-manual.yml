name: Mac host filesystem (manual)

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact wasmer-next candidate commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-host:
    runs-on: macos-15
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 3
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - name: Scoped unprivileged filesystem gates
        shell: bash
        timeout-minutes: 57
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import subprocess
          import tomllib

          root = Path(os.environ["RUNNER_TEMP"]) / "wlk-macos-host"
          root.mkdir(mode=0o700)
          evidence = root / "evidence"
          evidence.mkdir()
          context = root / "context"
          context.mkdir()
          candidate = Path(os.environ["GITHUB_WORKSPACE"]) / "candidate"
          env = os.environ.copy()
          for key, directory in [("CARGO_HOME", "cargo"), ("RUSTUP_HOME", "rustup"), ("CARGO_TARGET_DIR", "target")]:
              path = root / directory
              path.mkdir(mode=0o700)
              env[key] = str(path)
          receipt = []
          reserve = 2 * 1024**3
          max_log = 8 * 1024**2

          def fingerprint():
              names = subprocess.check_output(["git", "ls-files", "-z"], cwd=candidate).split(b"\0")
              digest = hashlib.sha256()
              for name in sorted(n for n in names if n):
                  digest.update(name + b"\0")
                  digest.update(hashlib.sha256((candidate / os.fsdecode(name)).read_bytes()).digest())
              return digest.hexdigest()

          def run(name, args, seconds, growth):
              available = shutil.disk_usage(root).free
              if available < growth + reserve:
                  raise RuntimeError(f"{name}: free={available}, required={growth + reserve}")
              before = fingerprint()
              log = evidence / f"{name}.log"
              status = None
              try:
                  with log.open("wb") as output:
                      child = subprocess.Popen(args, cwd=context, env=env, stdout=output,
                                               stderr=subprocess.STDOUT, start_new_session=True)
                      try:
                          status = child.wait(timeout=seconds)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid, signal.SIGKILL)
                          child.wait()
                          raise
              finally:
                  after = shutil.disk_usage(root).free
                  actual_growth = max(0, available - after)
                  unchanged = before == fingerprint()
                  receipt.append(dict(phase=name, command=args, status=status,
                                      available_before=available, available_after=after,
                                      growth=actual_growth, growth_limit=growth,
                                      reserve=reserve, source_unchanged=unchanged))
                  (evidence / "runs.json").write_text(json.dumps(receipt, indent=2))
                  if log.exists() and log.stat().st_size > max_log:
                      with log.open("r+b") as output:
                          output.truncate(max_log)
                  if actual_growth > growth or after < reserve or not unchanged:
                      raise RuntimeError(f"{name}: disk or frozen-source guard failed")
              print(f"{name}: status={status} growth={actual_growth} free={after}", flush=True)
              if status != 0:
                  print(log.read_text(errors="replace"), flush=True)
                  raise RuntimeError(f"{name}: command failed ({status})")
              return log.read_text(errors="replace")

          expected = env["EXPECTED_CANDIDATE"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise RuntimeError("candidate_ref must be a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=candidate, text=True).strip()
          if actual != expected or os.geteuid() == 0 or os.uname().machine != "arm64":
              raise RuntimeError("candidate identity or unprivileged arm64 runner requirement failed")
          source_hash = fingerprint()
          (evidence / "source.json").write_text(json.dumps(dict(
              sha=actual, tracked_sha256=source_hash, uid=os.geteuid(),
              uname=list(os.uname()), deployment_target=env["MACOSX_DEPLOYMENT_TARGET"],
              macos=subprocess.check_output(["sw_vers", "-productVersion"], text=True).strip(),
              run_id=env["GITHUB_RUN_ID"], run_attempt=env["GITHUB_RUN_ATTEMPT"]), indent=2))
          channel = tomllib.loads((candidate / "wlk/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          rustup = shutil.which("rustup")
          if not rustup:
              raise RuntimeError("preinstalled rustup missing")
          run("toolchain", [rustup, "toolchain", "install", channel, "--profile", "minimal",
                            "--component", "clippy", "--no-self-update"], 300, 2 * 1024**3)
          cargo = Path(subprocess.check_output([rustup, "which", "--toolchain", channel, "cargo"],
                                               cwd=context, env=env, text=True).strip())
          tools = cargo.parent
          for tool in ["cargo", "rustc", "rustdoc", "cargo-clippy", "clippy-driver"]:
              path = tools / tool
              if path.is_symlink() or not path.is_file() or not os.access(path, os.X_OK):
                  raise RuntimeError(f"expected actual toolchain executable: {path}")
          env["PATH"] = str(tools) + os.pathsep + env["PATH"]
          env["RUSTUP_TOOLCHAIN"] = channel
          (evidence / "rust.txt").write_text(subprocess.check_output([str(tools / "rustc"), "-Vv"], env=env, text=True))
          base = [str(cargo), "--manifest-path", str(candidate / "wlk/Cargo.toml")]
          # The subcommand must precede --manifest-path.
          def command(subcommand, *args):
              return [base[0], subcommand, *base[1:], "--locked", *args]
          packages = ["wasixv2-vfs", "wasixv2-vfs-overlay", "wasixv2-vfs-host", "wasixv2-kernel"]
          selectors = [arg for package in packages for arg in ["-p", package]]
          run("check", command("check", *selectors, "--all-targets"), 900, 4 * 1024**3)
          run("clippy", command("clippy", *selectors, "--all-targets", "--", "-D", "clippy::all"), 900, 2 * 1024**3)
          tests = {}
          for package in packages[:3]:
              text = run(package, command("test", "-p", package, "--", "--nocapture"), 600, 3 * 1024**3)
              counts = [int(n) for n in re.findall(r"test result: ok\. (\d+) passed", text)]
              if not counts or sum(counts) == 0:
                  raise RuntimeError(f"{package}: no passing tests")
              tests[package] = counts
          name = "tests::fs::macos_name_observations_preserve_guest_stat_write_grants_and_parent_name_operations"
          listing = run("kernel-list", command("test", "-p", packages[3], "--lib", "macos_name_observations", "--", "--list"), 600, 3 * 1024**3)
          if listing.splitlines().count(name + ": test") != 1:
              raise RuntimeError("expected exactly one original Mac guest-memory test")
          text = run("kernel-macos", command("test", "-p", packages[3], "--lib", name, "--", "--exact", "--nocapture"), 300, 1024**3)
          if not re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", text):
              raise RuntimeError("Mac guest-memory gate did not execute exactly once")
          tests["kernel-macos"] = 1
          name = "tests::landlock::macos_name_observations_landlock_exact_write_only_file_keeps_its_rule_identity"
          listing = run("kernel-landlock-list", command("test", "-p", packages[3], "--lib", name, "--", "--list"), 300, 1024**3)
          if listing.splitlines().count(name + ": test") != 1:
              raise RuntimeError("expected exactly one Mac Landlock identity test")
          text = run("kernel-landlock", command("test", "-p", packages[3], "--lib", name, "--", "--exact", "--nocapture"), 300, 1024**3)
          if not re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", text):
              raise RuntimeError("Mac Landlock identity gate did not execute exactly once")
          tests["kernel-landlock"] = 1
          (evidence / "tests.json").write_text(json.dumps(tests, indent=2))
          if fingerprint() != source_hash:
              raise RuntimeError("final candidate source fingerprint changed")
          PY
      - name: Bound evidence even after cancellation or step timeout
        if: always()
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "wlk-macos-host"
          source = root / "evidence"
          output = root / "upload"
          output.mkdir(parents=True, exist_ok=True)
          phases = ["toolchain", "check", "clippy", "wasixv2-vfs", "wasixv2-vfs-overlay",
                    "wasixv2-vfs-host", "kernel-list", "kernel-macos", "kernel-landlock-list", "kernel-landlock"]
          names = [p + ".log" for p in phases] + ["source.json", "runs.json", "rust.txt", "tests.json"]
          for name in names:
              path = source / name
              if path.is_file() and not path.is_symlink():
                  with path.open("rb") as stream:
                      (output / name).write_bytes(stream.read(8 * 1024**2))
          (output / "collection.txt").write_text("Allowlisted receipts capped at 8 MiB each; missing receipts are not passes.\n")
          PY
      - name: Upload bounded source and runtime receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: wlk-macos-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wlk-macos-host/upload
          if-no-files-found: error
          retention-days: 14

name: Private runtime access
description: Configure Cargo Git CLI access to the private engine
inputs:
  token:
    description: GitHub App installation token with Contents-read access to wasmerio/wasmer-runtime
    required: true
runs:
  using: composite
  steps:
    - name: Configure git credentials for cargo
      shell: bash
      env:
        PRIVATE_DEPS_TOKEN: ${{ inputs.token }}
      run: |
        set -Eeuo pipefail

        if [ -z "${PRIVATE_DEPS_TOKEN:-}" ]; then
          echo "::error::No token supplied; cargo cannot fetch wasmerio/wasmer-runtime."
          exit 1
        fi

        token_file="$RUNNER_TEMP/wasmer_runtime_token"
        # Git for Windows invokes credential helpers through its POSIX shell.
        if command -v cygpath >/dev/null 2>&1; then
          token_file="$(cygpath -u "$token_file")"
        fi
        install -m 600 /dev/null "$token_file"
        printf '%s' "$PRIVATE_DEPS_TOKEN" > "$token_file"

        git config --global credential.useHttpPath true
        for u in \
          "https://github.com/wasmerio/wasmer-runtime" \
          "https://github.com/wasmerio/wasmer-runtime.git"; do
          git config --global credential."$u".helper \
            "!f() { test -r '$token_file' || return 0; \
                    echo username=x-access-token; \
                    echo \"password=\$(cat '$token_file')\"; }; f"
          # Keep checkout's GITHUB_TOKEN from overriding runtime credentials.
          git config --global http."$u".extraheader ''
        done

        echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
        GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code \
          https://github.com/wasmerio/wasmer-runtime refs/heads/next >/dev/null
        echo "cargo can reach wasmerio/wasmer-runtime"

[package]
name = "wasmer-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A portable, package-first sandbox SDK powered by Wasmer"
license-file = "LICENSE"
repository = "https://github.com/wasmerio/wasmer-sdk"
publish = false

[features]
default = ["sys"]
sys = ["virtual-fs/host-fs", "virtual-net/host-net", "wasmer/cranelift", "wasixv2/sys", "wasixv2/tokio", "wasixv2/host-network", "wasixv2/wasix1"]
napi-v8 = ["sys", "dep:wasmer-napi", "wasmer-napi/wasix"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
crossbeam-queue.workspace = true
futures.workspace = true
http.workspace = true
instant = "0.1"
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
virtual-fs = { path = "../../virtual-fs", default-features = false }
virtual-net = { path = "../../virtual-net", default-features = false }
wasmer = { path = "../../api", default-features = false }
wasmer-cache = { path = "../../cache", default-features = false, features = ["module-cache-filesystem", "module-cache-sys"] }
wasmer-c-api-imports = { path = "../../c-api-imports", default-features = false, features = ["sys", "wasixv2"] }
wasmer-config.workspace = true
wasmer-package = { workspace = true, features = ["acquisition-thread", "http-client", "authoring"] }
wasmer-types = { path = "../../types", features = ["detect-wasm-features"] }
wasixv2 = { path = "../../wasix/api", default-features = false, features = ["resolved-packages"] }
wasixv2-dylink = { path = "../../wasix/dylink", default-features = false, features = ["sys"] }
wasixv2-abi.workspace = true
wasixv2-host = { workspace = true, features = ["tokio"] }
wasixv2-vfs.workspace = true
wasixv2-vnet.workspace = true
wasixv2-vnet-host.workspace = true
wasixv2-wait.workspace = true
webc = { version = "=12.0.1", default-features = false, features = ["v3"] }
wasmparser.workspace = true
wasmer-napi = { path = "../../napi", optional = true, default-features = false }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
wat.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

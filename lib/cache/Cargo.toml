[package]
name = "wasmer-cache"
description = "Cache system for Wasmer WebAssembly runtime"
categories = ["wasm", "caching"]
keywords = ["wasm", "webassembly", "cache"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
wasmer = { workspace = true, default-features = false }
hex.workspace = true
thiserror.workspace = true
blake3.workspace = true
async-trait = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
shared-buffer = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true, features = ["attributes", "std"] }
wasmer-types = { workspace = true, default-features = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, default-features = false }
clap = { workspace = true, default-features = true }
clap_builder.workspace = true
clap_derive.workspace = true
clap_lex.workspace = true
tempfile.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
wasmer-compiler-singlepass = { workspace = true }
wasmer = { workspace = true, default-features = false, features = [
  "sys",
  "cranelift",
  "wat",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wasmer = { workspace = true, default-features = false, features = [
  "sys",
  "v8",
  "wat",
] }

[features]
default = ["filesystem"]
filesystem = []
blake3-pure = ["blake3/pure"]
module-cache = ["dep:async-trait", "dep:dashmap", "dep:futures", "dep:shared-buffer", "dep:tracing", "dep:wasmer-types"]
module-cache-filesystem = ["module-cache", "dep:tempfile", "dep:tokio", "tokio/fs", "tokio/io-util"]
module-cache-sys = ["module-cache", "wasmer/sys"]

[package.metadata.docs.rs]
features = ["wasmer/sys", "wasmer/compiler", "wasmer/cranelift"]
rustc-args = ["--cfg", "docsrs"]

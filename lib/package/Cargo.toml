[package]
name = "wasmer-package"
version = "0.705.0"
description = "Packaging related types and functions for Wasmer"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
webc.workspace = true
wasmer-config = { version = "0.705.0", path = "../config", optional = true }
wasmer-types = { workspace = true, default-features = true, optional = true, features = [
  "detect-wasm-features",
] }
toml = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
shared-buffer = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror.workspace = true
ciborium = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
url = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
http = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true, features = ["attributes", "std"] }
walkdir = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
pin-utils = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { workspace = true, optional = true }

[target.'cfg(not(any(target_arch = "riscv64", target_arch = "loongarch64")))'.dependencies.reqwest]
workspace = true
default-features = false
features = ["rustls", "json", "stream", "socks", "blocking"]
optional = true

[target.'cfg(any(target_arch = "riscv64", target_arch = "loongarch64"))'.dependencies.reqwest]
workspace = true
default-features = false
features = ["native-tls", "json", "stream", "socks", "blocking"]
optional = true

[target.'cfg(all(target_family = "wasm", target_os = "wasi"))'.dependencies]
libc.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["filters", "yaml"] }
pretty_assertions.workspace = true
tempfile.workspace = true
regex.workspace = true
ureq.workspace = true
hexdump.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
default = ["execution", "authoring"]
acquisition = [
  "execution",
  "dep:anyhow",
  "dep:async-trait",
  "dep:derive_more",
  "dep:futures",
  "dep:flate2",
  "dep:hex",
  "dep:http",
  "dep:itertools",
  "dep:petgraph",
  "dep:semver",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
  "dep:tempfile",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
  "dep:walkdir",
  "dep:wasmer-config",
  "dep:web-time",
  "dep:zstd",
]
acquisition-thread = ["acquisition", "tokio/rt-multi-thread"]
http-client = ["acquisition", "dep:reqwest", "dep:pin-utils", "tokio/macros", "tokio/time"]
http-client-js = ["dep:wasm-bindgen-futures"]
execution = ["dep:bytes", "dep:wasmer-types"]
authoring = [
  "execution",
  "dep:anyhow",
  "dep:ciborium",
  "dep:flate2",
  "dep:ignore",
  "dep:semver",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
  "dep:shared-buffer",
  "dep:tar",
  "dep:tempfile",
  "dep:toml",
  "dep:url",
  "dep:wasmer-config",
]

[package]
name = "wasix1-io-reference"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[features]
default = ["sys"]
sys = []

[dependencies]
futures = "0.3.30"
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
parking = "2.2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[package]
name = "wasixv2"
version = "0.0.0"
description = "Embedding facade that assembles and boots a WASIX machine"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wasixv2-abi = { workspace = true }
wasixv2-syscalls = { workspace = true }
wasixv2-trace = { workspace = true }
wasixv2-record = { workspace = true }
wasixv2-policy = { workspace = true }
wasixv2-host = { workspace = true }
wasixv2-wait = { workspace = true, optional = true }
wasixv2-vfs = { workspace = true }
wasixv2-vfs-mem = { workspace = true }
wasixv2-vfs-host = { workspace = true }
wasixv2-vfs-overlay = { workspace = true }
wasixv2-vfs-package = { workspace = true }
wasixv2-vnet = { workspace = true }
wasixv2-vnet-host = { workspace = true, optional = true }
wasixv2-vnet-switch = { workspace = true }
wasixv2-vnet-web = { workspace = true, optional = true }
wasixv2-vfs-web = { workspace = true, optional = true }
wasixv2-stdio-web = { workspace = true, optional = true }
wasixv2-kernel = { workspace = true }
wasixv2-pages = { workspace = true }
wasixv2-checkpoint = { workspace = true }
wasixv2-exec = { path = "../exec", default-features = false }
wasixv2-dylink = { path = "../dylink", default-features = false }
wasixv2-wasix1 = { path = "../wasix1", default-features = false, optional = true }
wasmer = { workspace = true, default-features = false }
shared-buffer.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmparser.workspace = true
webc.workspace = true
wasmer-package = { workspace = true, features = [
  "acquisition",
], optional = true }
wasmer-types = { workspace = true, optional = true, default-features = false }
wasmer-config = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-trait.workspace = true
wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
wasmer-types = { workspace = true, default-features = false }
tempfile.workspace = true
wat.workspace = true

[target.'cfg(unix)'.dependencies]
tokio = { workspace = true, optional = true, features = [
  "fs",
  "io-util",
  "sync",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util.workspace = true
bincode = { workspace = true, features = ["serde"] }
wasix1-net-reference = { path = "tests/support/classic-reference" }
wasixv2-vnet-web = { workspace = true }
wasixv2-wait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dev-dependencies]
wasmer = { workspace = true, default-features = false, features = [
  "cranelift",
  "experimental-host-interrupt",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wasmer = { workspace = true, default-features = false, features = [
  "v8-default",
] }

[features]
resolved-packages = ["dep:wasmer-package", "dep:wasmer-config", "dep:futures-util", "dep:bytes", "dep:wasmer-types"]
default = ["sys", "tokio", "host-network", "wasix1"]
sys = [
  "dep:wasixv2-wait",
  "wasmer/sys",
  "wasmer/headless",
  "wasixv2-exec/sys",
  "wasixv2-dylink/sys",
  "wasixv2-wasix1?/sys",
]
js = [
  "wasmer/js-default",
  "wasixv2-exec/js",
  "wasixv2-dylink/js",
  "wasixv2-wasix1?/js",
]
# Runs WASIX v1 (and plain WASI preview1) programs too.
wasix1 = ["dep:wasixv2-wasix1"]
# `Machine::new` and `Stdio::inherit` on a tokio runtime.
tokio = ["wasixv2-host/tokio"]
# Inherited native terminal policy and shared raw-mode leases, independent of the engine.
terminal = ["wasixv2-host/terminal", "dep:tokio"]
# Guest traffic leaving the machine goes through host sockets (Unix only). Without it the
# network is loopback-only.
host-network = ["dep:wasixv2-vnet-host"]
# `WebHost`, for embedders on a JavaScript event loop; pair with `js` on wasm32.
web = ["wasixv2-host/web"]
# Full shared-runtime worker profile. Disable defaults when targeting the browser.
browser-drivers = [
  "dep:wasixv2-vnet-web",
  "dep:wasixv2-vfs-web",
  "dep:wasixv2-stdio-web",
]
browser = [
  "js",
  "web",
  "wasixv2-host/browser",
  "browser-drivers",
  "dep:wasixv2-wait",
  "dep:futures-util",
  "dep:wasm-bindgen",
]

[[example]]
name = "browser-facade"
crate-type = ["cdylib"]
required-features = ["browser", "wasix1"]

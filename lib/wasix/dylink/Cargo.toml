[package]
name = "wasixv2-dylink"
version = "0.0.0"
description = "Side-module loading and linking for WASIX"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wasixv2-exec = { path = "../exec", default-features = false, optional = true }
wasmer = { workspace = true, default-features = false, optional = true }

wasmer-types = { workspace = true, default-features = false, optional = true }
wasixv2-abi = { workspace = true, optional = true }
wasixv2-syscalls = { workspace = true, optional = true }
wasixv2-host = { workspace = true, optional = true }
wasmparser.workspace = true
wasm-encoder = { workspace = true, features = ["wasmparser"] }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-lock = { version = "3.4.2", optional = true }
wasmer-cache = { path = "../../cache", default-features = false, features = ["module-cache"], optional = true }
loupe = { workspace = true, optional = true }
# The persistent key reads compiler feature settings even in builds with no backend.
wasmer-compiler = { workspace = true, features = ["artifact-size", "compiler"], optional = true }
wasmer-vm = { workspace = true, default-features = false, features = ["artifact-size"], optional = true }

[dev-dependencies]
futures.workspace = true
wat.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
wasmer-cache = { path = "../../cache", default-features = false, features = ["module-cache-filesystem"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
js-sys.workspace = true

[features]
default = ["sys"]
sys = [
  "dep:async-lock",
  "dep:wasmer-cache",
  "dep:loupe",
  "dep:wasmer-compiler",
  "dep:wasmer-vm",
  "dep:tracing",
  "dep:wasmer-types",
  "dep:wasixv2-abi",
  "dep:wasixv2-syscalls",
  "dep:wasixv2-host",
  "wasmer/sys",
  "wasmer/headless",
  "wasixv2-exec/sys",
]
js = [
  "dep:tracing",
  "dep:wasmer-types",
  "dep:wasixv2-abi",
  "dep:wasixv2-syscalls",
  "dep:wasixv2-host",
  "wasmer/js-default",
  "wasmer/js-serializable-module",
  "wasixv2-exec/js",
]

# Explicit opt-in keeps planner-only tests independent of native compiler crates.
engine-tests = ["sys", "wasmer/cranelift"]

[package]
name = "wasmer-swift"
version = "0.705.0"
description = "Experimental wasmer bindings for swift"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["staticlib", "lib"]
name = "wasmer_swift"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"], default-features = false }
uniffi.workspace = true
wasmer = { workspace = true, default-features = false, features = [
  "cranelift",
  "std",
] }
wasixv2 = { path = "../wasix/api", default-features = false, features = [
  "sys",
  "tokio",
  "wasix1",
  "host-network",
  "resolved-packages",
] }
wasmer-config.workspace = true
webc.workspace = true
wasmer-package = { workspace = true, features = ["acquisition-thread", "http-client", "authoring"] }


[dev-dependencies]
futures-util.workspace = true
serde_json.workspace = true
wat.workspace = true

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[package.metadata.docs.rs]
features = ["wasmer/sys", "wasmer/cranelift"]
rustc-args = ["--cfg", "docsrs"]

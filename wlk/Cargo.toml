[workspace]
members = [
  "crates/abi",
  "crates/syscalls",
  "crates/wait",
  "crates/pages",
  "crates/host",
  "crates/kernel",
  "crates/vfs",
  "crates/vfs-mem",
  "crates/vfs-host",
  "crates/vfs-overlay",
  "crates/vfs-package",
  "crates/vfs-web",
  "crates/vnet",
  "crates/vnet-host",
  "crates/vnet-switch",
  "crates/vnet-web",
  "crates/stdio-web",
  "crates/trace",
  "crates/record",
  "crates/policy",
  "crates/checkpoint",
  "crates/native",
]
exclude = ["third-party/shared-buffer"]
resolver = "2"

[workspace.package]
authors = ["Wasmer Engineering Team <engineering@wasmer.io>"]
edition = "2024"
homepage = "https://wasmer.io/"
license = "MIT"
repository = "https://github.com/wasmerio/wasmer-next"
rust-version = "1.96"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.68"
bincode = "=2.0.1"
futures = "0.3.30"
futures-util = "0.3.31"
getrandom = "0.4.1"
js-sys = "0.3.77"
libc = { version = "0.2.178", default-features = false }
mio = "1"
serde = { version = "1", default-features = false }
shared-buffer = "0.1.4"
socket2 = { version = "0.6.1", features = ["all"] }
tempfile = "3.6.0"
thiserror = "2.0.17"
tokio = { version = "1.53.3", default-features = false }
tracing = { version = "0.1", default-features = false }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4.70"
wasm-bindgen-test = "0.3.70"
web-time = "1.1"
webc = { version = "=12.0.1", default-features = false, features = [
  "v2",
  "v3",
] }

[patch.crates-io]
shared-buffer = { path = "third-party/shared-buffer" }

[package]
name = "wlk-native"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "wlk-native"
path = "src/main.rs"

[dependencies]
libc = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "io-util", "io-std"] }
wasixv2-abi = { path = "../abi" }
wasixv2-host = { path = "../host", features = ["tokio"] }
wasixv2-kernel = { path = "../kernel" }
wasixv2-syscalls = { path = "../syscalls" }
wasixv2-vfs = { path = "../vfs" }
wasixv2-vfs-host = { path = "../vfs-host" }
wasixv2-vnet = { path = "../vnet" }
wasixv2-vnet-host = { path = "../vnet-host" }
